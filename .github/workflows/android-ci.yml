name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest includes an Android SDK; avoid reinstalling command-line tools.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms" || exit 1
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Identify build branch
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          safe_branch=$(printf '%s' "$branch" | sed -E 's/[^a-zA-Z0-9._-]+/-/g; s/^-+//; s/-+$//')
          echo "BUILD_BRANCH=${safe_branch:-unknown}" >> "$GITHUB_ENV"
      - name: Prepare versioned APK
        if: success()
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Pocam-v0.3.0-${{ env.BUILD_BRANCH }}-build-${{ github.run_number }}.apk"
      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pocam-v0.3.0-${{ env.BUILD_BRANCH }}-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: ${{ success() && github.event_name != 'pull_request' && github.ref_type == 'branch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-build-${{ github.run_number }}
          name: Pocam ${{ env.BUILD_BRANCH }} CI Build #${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: false
          body: |
            Automated Pocam debug APK for branch ${{ github.ref_name }} built from commit ${{ github.sha }}.
            For device testing only. Not a production release.
          files: dist/*.apk
          fail_on_unmatched_files: true
