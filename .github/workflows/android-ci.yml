name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest includes an Android SDK; avoid reinstalling command-line tools.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms" || exit 1
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare versioned APK
        if: success()
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Pocam-v0.2.1-build-${{ github.run_number }}.apk"
      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pocam-v0.2.1-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
